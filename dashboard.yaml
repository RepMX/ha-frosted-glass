  subheading_caps:
    variables:
      var_name: null
    type: custom:button-card
    name: "[[[ return variables.var_name]]]"
    styles:
      grid:
        - grid-template-columns: 1fr
        - grid-template-rows: min-content
      card:
        - justify-self: start
          justify-content: start
          align-self: start
          align-content: start
          border-radius: 0px
          background: transparent
          background-color: transparent
          border: none
          padding: 0px 10px
          text-align: left
          height: 20px
          overflow: visible
      name:
        - font-family: var(--primary-font-family)
          justify-self: start
          align-self: start
          font-size: 23px
          font-weight: 300
          letter-spacing: 1px
          color: rgba(255,255,255,0.4)
          text-transform: uppercase
