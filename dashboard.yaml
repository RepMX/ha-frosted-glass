            font-weight: 300;
            background: {% if is_state(config.entity, 'on') %} linear-gradient(135deg, rgba(255, 255, 255, 0.32) 0%, rgba(255, 255, 255, 0.12) 100%) {% else %} linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.03) 100%) {% endif %} !important;
            backdrop-filter: blur(30px) saturate(120%) brightness(95%) !important;
