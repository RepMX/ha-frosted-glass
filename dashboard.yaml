          [[[ 
            const area = entity.entity_id.split('_').pop();
            const map = { master: 'bedroom', kids: 'bedroom_2', living: 'living_room', dining: 'dining', kitchen: 'kitchen', office: 'office' };
            return hass.areas[map[area] || area]?.icon ;
          ]]]
        styles:
          card:
            - background: rgba(255,255,255,0.3) !important
    styles:
      grid:
        - grid-template-areas: "\"i n\" \"i s\""
        - grid-template-columns: max-content 1fr
        - grid-template-rows: 1fr
      card:
        - background-color: transparent
        - height: 60px
        - width: 100%
        - box-sizing: border-box
        - padding: 0px 10px
        - align-content: start
        - justify-content: start
        - align-self: start
      name:
        - font-family: "'Dongle', sans-serif"
        - box-sizing: border-box
        - width: 100%
        - text-align: left
        - justify-self: start
        - padding: 5px 15px
        - margin: 0px
        - font-size: 27px
        - font-weight: 300
