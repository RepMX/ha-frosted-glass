                  cards:
                    - type: custom:button-card
                      entity: sensor.all_lights_counter
                      show_state: false
                      show_name: true
                      show_icon: true
                      max_columns: 4
                      name: |
                        [[[ 
                          const ent = states['sensor.all_lights_counter'];
                          if (!ent) return "Loading";
                          const count = ent.state;
                          if (count === '0') {
                            return "All Lights OFF";
                          } else if (parseInt(count, 10) === 1) {
                            return `${count} Light ON`;
                          } else if (parseInt(count, 10) > 1) {
                            return `${count} Lights ON`;
                          } else {
                            return `Unavailable`;
                          }
                        ]]]
                      icon: |
                        [[[ 
                          const ent = states['sensor.all_lights_counter'];
                          if (!ent) return `mdi:lightbulb-question`;
                          const count = ent.state;
                          if (count === '0') {
                            return `mdi:lightbulb-outline`;
                          } else if (parseInt(count, 10) === 1) {
                            return `mdi:lightbulb`;
                          } else if (parseInt(count, 10) > 1) {
                            return `mdi:lightbulb-group`;
                          } else {
                            return `mdi:lightbulb-question`;
                          }
                        ]]]
                      tap_action:
                        action: navigate
                        navigation_path: "#lights"
