  alarm_list_slot:
    entity: sensor.alarm_clock_items
    show_name: false
    show_state: false
    show_icon: false
    tap_action:
      action: call-service
      service: todo.update_item
      target:
        entity_id: todo.alarm_clock_list
      data:
        item: |
          [[[
            const alarms = entity && entity.attributes ? entity.attributes.alarms : null;
            return (alarms && alarms[variables.slot_index]) ? alarms[variables.slot_index].uid : '';
          ]]]
        status: |
          [[[
            const alarms = entity && entity.attributes ? entity.attributes.alarms : null;
            const alarm = alarms && alarms[variables.slot_index];
            return (alarm && alarm.status === 'needs_action') ? 'completed' : 'needs_action';
          ]]]
    extra_styles: |
      :host, #aspect-ratio {
        max-width: none !important;
        justify-self: center !important;
      }
      [[[
        const alarms = entity && entity.attributes ? entity.attributes.alarms : null;
        if (!alarms || alarms.length <= variables.slot_index) {
          return ':host { display: none !important; }';
        }
        return '';
      ]]]
    styles:
      card:
        - display: |
            [[[ 
              const alarms = entity && entity.attributes ? entity.attributes.alarms : null;
              return (alarms && alarms.length > variables.slot_index) ? 'block' : 'none';
            ]]]
        - background-color: transparent
        - padding: 12px 14px 12px 20px
        - margin: 0px 0px 8px 0px
        - border: none
        - pointer-events: auto
      grid:
        - grid-template-areas: "\"info action\""
        - grid-template-columns: 1fr auto
        - align-items: center
    custom_fields:
      info: |
        [[[
          const alarms = entity && entity.attributes ? entity.attributes.alarms : null;
          if (!alarms || alarms.length <= variables.slot_index) return '';
          const alarm = alarms[variables.slot_index];
          if (!alarm) return '';
          
          let meta = { days: [], targets: [] };
          try {
            meta = JSON.parse(alarm.description);
          } catch(e) {}
          
          // Phrasing execution loops
          const weekdays = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
          const weekends = ['Saturday', 'Sunday'];
          let frequencyText = "Once";
          
          if (meta && meta.days && meta.days.length > 0) {
            const includesAllWeekdays = weekdays.every(d => meta.days.includes(d));
            const includesAllWeekends = weekends.every(d => meta.days.includes(d));
            
            if (includesAllWeekdays && includesAllWeekends) {
              frequencyText = "Everyday";
            } 
            else if (includesAllWeekdays) {
              const remaining = meta.days.filter(d => !weekdays.includes(d));
              if (remaining.length === 0) {
                frequencyText = "Every Weekdays";
              } else {
                frequencyText = `Every Weekdays and ${remaining[0]}`;
              }
            } 

            else if (includesAllWeekends) {
              const dayOrder = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
              const remaining = meta.days.filter(d => !weekends.includes(d))
                                          .sort((a, b) => dayOrder.indexOf(a) - dayOrder.indexOf(b));
              if (remaining.length === 0) {
                frequencyText = "Every Weekends";
              } else if (remaining.length === 1) {
                frequencyText = `Every Weekends and ${remaining[0]}`;
              } else if (remaining.length === 2) {
                frequencyText = `Every Weekends, ${remaining[0]}, and ${remaining[1]}`;
              } else {
                const lastDay = remaining.pop();
                frequencyText = `Every Weekends, ${remaining.join(', ')}, and ${lastDay}`;
              }
            } 

            else {
              const dayOrder = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
              const sortedDays = [...meta.days].sort((a, b) => dayOrder.indexOf(a) - dayOrder.indexOf(b));
              
              const pluralDays = sortedDays.map(d => d + 's');
              if (pluralDays.length === 1) {
                frequencyText = `Every ${pluralDays[0]}`;
              } else if (pluralDays.length === 2) {
                frequencyText = `Every ${pluralDays[0]} and ${pluralDays[1]}`;
              } else {
                const lastDay = pluralDays.pop();
                frequencyText = `Every ${pluralDays.join(', ')}, and ${lastDay}`;
              }
            }
          }

          // Dynamic Opacities for Text Fields based on Alarm Status
          const isComp = alarm.status === 'completed';
          const colorTime = isComp ? 'rgba(255,255,255,0.35)' : 'rgba(255,255,255,0.9)';
          const colorFreq = isComp ? 'rgba(255,255,255,0.25)' : 'rgba(255,255,255,0.7)';
          const colorTarget = isComp ? 'rgba(255,255,255,0.15)' : 'rgba(255,255,255,0.4)';

          const targetsText = (meta && meta.targets && meta.targets.length > 0) 
            ? `<div style="display: flex; align-items: center; gap: 4px; font-size: 16px; color: ${colorTarget}; overflow: hidden;">
                 <ha-icon icon="mdi:map-marker" style="--mdc-icon-size: 16px; flex-shrink: 0; color: ${colorTarget};"></ha-icon>
                 <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-box: trim-both cap alphabetic; padding: 5px 0px">${meta.targets.join(', ')}</span>
               </div>`
            : '';

          return `
            <div style="display: flex; flex-direction: row; align-items: center; gap: 12px; width: 100%; overflow: hidden;">
              <div style="font-size: 44px; font-weight: 300; color: ${colorTime}; white-space: nowrap; text-box: trim-both cap alphabetic; padding: 5px 0px">
                ${alarm.summary}
              </div>
              
              <div style="font-size: 18px; font-weight: 300; color: ${colorFreq}; white-space: nowrap; text-box: trim-both cap alphabetic; padding: 5px 0px">
                ${frequencyText}
              </div>
              
              ${targetsText}
            </div>
          `;
        ]]]
      action:
        card:
          type: custom:button-card
          icon: mdi:delete-outline
          show_name: false
          styles:
            card:
              - background: transparent
              - border: none
              - box-shadow: none
              - width: 36px
              - height: 36px
            icon:
              - color: rgba(255, 255, 255, 0.4)
              - width: 22px
          tap_action:
            action: call-service
            service: todo.remove_item
            target:
              entity_id: todo.alarm_clock_list
            data:
              item: |
                [[[
                  const s = states['sensor.alarm_clock_items'];
                  const alarms = s && s.attributes ? s.attributes.alarms : null;
                  return (alarms && alarms[variables.slot_index]) ? alarms[variables.slot_index].uid : '';
                ]]]
    card_mod:
      style:
        .: >
          {% set index = config.variables.slot_index | int %}

          {% set alarms = state_attr('sensor.alarm_clock_items', 'alarms') %}

          {% set is_completed = alarms and alarms[index] is defined and
          alarms[index].status == 'completed' %}

          ha-card {
            font-family: "Dongle", sans-serif;
            font-weight: 300;
            background: {% if is_completed %} linear-gradient(135deg, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0) 100%) {% else %} linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.03) 100%) {% endif %} !important;
            backdrop-filter: blur(30px) saturate(120%) brightness(95%) !important;
            -webkit-backdrop-filter: blur(30px) saturate(120%) brightness(95%) !important;
            -webkit-tap-highlight-color: transparent !important;
            transition: transform 0.2s ease, filter 0.2s ease, background-color 0.15s ease;
            box-shadow: inset -6px 6px 12px rgba(0, 0, 0, 0.08), inset 3px -3px 12px rgba(255, 255, 255, 0.03), {% if is_completed %} 3px 10px 25px rgba(0, 0, 0, 0.05) {% else %} 3px 10px 25px rgba(0, 0, 0, 0.2) {% endif %} !important;
            border: none !important;
            border-radius: 30px !important;
            position: relative;
            z-index: 1;
          }


          :host {
            width: 100% !important;
            box-sizing: border-box !important;
            display: block;
            position: relative; 
            margin: 4px 10px 4px 10px;
            cursor: pointer;
            transition: transform 0.2s ease, filter 0.2s ease;
            overflow: visible !important;
          }


          ha-card:active {
            transform: scale(0.98);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0.08) 100%) !important;
          }


          :host:has(ha-card:active)::after {
            transform: scale(0.98) !important;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0.08) 100%) !important;
          }


          ha-card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 30px;
            backdrop-filter: blur(50px);
            -webkit-backdrop-filter: blur(50px);
            padding: 0.1rem;
            background: {% if is_completed %} linear-gradient(60deg, rgba(255,255,255,0.0) 0%, rgba(255,255,255,0.04) 50%, rgba(255,255,255,0.0) 100%) {% else %} linear-gradient(60deg, rgba(255,255,255,0.0) 0%, rgba(255,255,255,0.2) 49%, rgba(255,255,255,0.2) 51%, rgba(255,255,255,0.0) 100%) {% endif %};
            -webkit-mask:
              linear-gradient(#fff 0 0) content-box,
              linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            z-index: 2; 
            filter: saturate(140%);
            pointer-events: none;
          }


          :host::after {
            content: "";
            background: linear-gradient(180deg, rgba(255,255,255, 0.1) 20%, rgba(255,255,255, 0.0) 100%); 
            position: absolute;
            inset: 0;
            border-radius: 30px;
            z-index: -1;
            backdrop-filter: blur(30px) saturate(110%) brightness(90%);
            -webkit-backdrop-filter: blur(30px) saturate(110%) brightness(90%);
            filter: drop-shadow(3px 3px 10px rgba(0, 0, 0, 0.2)); 
          }
  person_status_badge:
    styles:
      grid:
        - grid-template-areas: "\"person\" \"person\""
      card:
        - background: transparent
        - justify-content: end
        - align-content: end
        - align-self: end
        - width: 60px
        - padding: 0px
        - border-radius: 0px
        - border: none
        - margin-right: "-20px"
    custom_fields:
      person:
        card:
          type: horizontal-stack
          cards:
            - type: custom:button-card
              entity: "[[[ return variables.person_entity ]]]"
              show_entity_picture: true
              show_name: false
              show_state: false
              styles:
                card:
                  - width: 35px
                  - height: 35px
                  - border-radius: 50%
                  - overflow: hidden
                  - padding: 0
                  - border: none
                entity_picture:
                  - width: 100%
                  - height: 100%
                  - object-fit: cover
                  - margin: 0
            - type: custom:button-card
              icon: |
                [[[ 
                  const person = states[variables.person_entity];
                  if (!person || ['unknown', 'unavailable'].includes(person.state)) {
                    return 'mdi:help'; 
                  }
                  
                  const loc = person.state;
                  const src = person.attributes.source;
                  
                  if (loc === 'not_home') {
                    // Away: Look up the icon assigned directly to the reporting hardware device
                    return (src && states[src] && states[src].attributes.icon) ? states[src].attributes.icon : 'mdi:help';
                  } else {
                    // In a Zone: Dynamically fetch the icon configured in that Zone's settings
                    const zone_entity = 'zone.' + loc;
                    const zone_icon = (states[zone_entity] && states[zone_entity].attributes.icon) ? states[zone_entity].attributes.icon : null;
                    if (zone_icon) return zone_icon;
                    
                    // Fallback defaults if the specific zone has no icon defined
                    if (loc === 'home') return 'mdi:home';
                    if (loc === 'office') return 'mdi:office-building';
                    return 'mdi:map-marker';
                  }
                ]]]
              show_name: false
              show_state: false
              show_icon: true
              styles:
                card:
                  - width: 15px
                  - height: 15px
                  - border-radius: 50%
                  - margin-left: "-18px"
                  - border: none
                  - align-self: center
                  - justify-self: center
                  - padding: 0px
                  - box-shadow: none
                  - background-color: transparent
                  - ha-card-border-width: 0px
                  - outline: none
                img_cell:
                  - background-color: |
                      [[[ 
                        const person = states[variables.person_entity];
                        if (!person || ['unknown', 'unavailable'].includes(person.state)) {
                          return '#808080';
                        }
                        
                        const loc = person.state;
                        const src = person.attributes.source;
                        
                        // Check if the current tracking device is online and actively updating
                        if (src && states[src] && !['unknown', 'unavailable'].includes(states[src].state)) {
                          if (loc === 'home') return 'var(--my-color-one)';
                          if (loc === 'office') return 'var(--my-color-two)';
                          if (loc === 'not_home') return 'var(--my-color-five)';
                          return 'var(--my-color-four)'; // Any custom zone (gym, school, store)
                        }
                        return '#808080'; // Grey out badge if the device tracker goes offline
                      ]]]
                icon:
                  - width: 70%
