                        img_cell:
                          - background-color: |
                              [[[ 
                                const ent = states['sensor.all_lights_counter'];
                                if (!ent) return `rgba(255,255,255,0.1)`;
                                const count = ent.state;
                                if (count === '0') {
                                  return `var(--my-color-two)`;
                                } else if (parseInt(count, 10) <= 3 && parseInt(count, 10) > 0) {
                                  return `var(--my-color-five)`;
                                } else if (parseInt(count, 10) > 3) {
                                  return `var(--my-color-six)`;
