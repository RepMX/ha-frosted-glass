            box-shadow: inset -6px 6px 12px rgba(0, 0, 0, 0.08), inset 3px -3px 12px rgba(255, 255, 255, 0.03), 3px 10px 25px rgba(0, 0, 0, 0.2) !important;
            border: none !important;
            border-radius: 30px !important;
            position: relative;
            z-index: 1;
          }

          ha-card:hover {
            filter: brightness(1.1);
          }

          :host {
            width: 100% !important;
            box-sizing: border-box !important;
            display: block;
            position: relative; 
            margin: 4px 10px 4px 10px;
            cursor: pointer;
            transition: transform 0.2s ease, filter 0.2s ease;
            overflow: visible !important;
          }

          :host(:active) {
            transform: scale(0.95);
          }

          ha-card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 30px;
            backdrop-filter: blur(50px);
            -webkit-backdrop-filter: blur(50px);
            padding: 0.1rem;
            background: linear-gradient(60deg, 
                rgba(255,255,255,0.0) 0%,
                rgba(255,255,255,0.2) 49%,
                rgba(255,255,255,0.2) 51%,
                rgba(255,255,255,0.0) 100%);
            -webkit-mask:
              linear-gradient(#fff 0 0) content-box,
              linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            z-index: 2; 
            filter: saturate(140%);
            pointer-events: none;
          }

          :host::after {
            content: "";
            background: linear-gradient(180deg, rgba(255,255,255, 0.1) 20%, rgba(255,255,255, 0.0) 100%); 
            position: absolute;
            inset: 0;
            border-radius: 30px;
            box-shadow: inset -8px 10px 15px rgba(0, 0, 0, 0.1);
            z-index: -1;
            backdrop-filter: blur(30px) saturate(110%) brightness(90%);
            -webkit-backdrop-filter: blur(30px) saturate(110%) brightness(90%);
            filter: drop-shadow(3px 3px 10px rgba(0, 0, 0, 0.2)); 
