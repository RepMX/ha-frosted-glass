kiosk_mode:
  non_admin_settings:
    kiosk: true
  hide_header: "{{ is_state('input_boolean.standby_kiosk_mode', 'on') }}"
  hide_sidebar: "{{ is_state('input_boolean.standby_kiosk_mode', 'on') }}"
button_card_templates:
views:
  - type: sections
    title: Dashboard
    path: dashboard
    layout:
      grid-rows: auto
    sections:
      - type: grid
        cards:
          - type: custom:button-card
            triggers_update:
              - sensor.live_clock
            styles:
              grid:
                - grid-template-areas: '"notifications time_pics"'
                  align-items: center
                  align-content: center
              card:
                - background-color: transparent
                  border-radius: 0px
                  height: 80px
                  width: 1300px
                  padding: 5px 5px 5px 5px
                  margin: 10px 25px 0px 5px
            custom_fields:
              notifications: ""
              time_pics:
                card:
                  type: custom:button-card
                  triggers_update:
                    - sensor.live_clock
                  styles:
                    grid:
                      - grid-template-areas: '"time pics"'
                      - grid-template-columns: min-content auto
                      - grid-template-rows: 1fr
                    card:
                      - background: transparent
                      - margin: 0px 0px 0px 0px
                      - justify-self: end
                      - justify-content: end
                      - align-self: center
                      - border-radius: 0px
                      - height: 80px
                    custom_fields:
                      pics:
                        - padding-right: 15px
                  show_state: true
                  show_name: false
                  show_icon: false
                  custom_fields:
                    time:
                      card:
                        type: custom:button-card
                        show_name: true
                        show_icon: false
                        show_state: false
                        tap_action:
                          action: perform-action
                          perform_action: input_boolean.toggle
                          target:
                            entity_id: input_boolean.standby_kiosk_mode
                        name: |
                          [[[
                            const clock = states['sensor.live_clock'];
                            if (!clock || !clock.state || ['unknown', 'unavailable'].includes(clock.state)) {
                              return '15:24<span class="clock-seconds">37</span>';
                            }
                            const t = clock.state;
                            const hm = t.slice(0, -3);
                            const s = t.slice(-2);
                            return `${hm}<span class="clock-seconds">${s}</span>`;
                          ]]]
                        extra_styles: |
                          .clock-seconds {
                            display: inline-block;
                            font-weight: 400;
                            text-box: trim-both cap alphabetic;
                            font-size: 42%;
                            color: rgba(220,220,220,0.6);
                            padding: 7px 0px 7px 7px;
                            transform: translateY(-72%);
                          }
                        styles:
                          card:
                            - background: transparent
                            - border: none
                            - box-shadow: none
                            - margin: 0px
                            - padding: 0px
                            - width: max-content
                            - height: max-content
                            - justify-self: end
                          name:
                            - font-family: "'Dongle', sans-serif"
                            - font-size: 96px
                            - font-weight: 300
                            - color: rgba(255,255,255,0.9)
                            - padding: 12px
                            - text-box: trim-both cap alphabetic
                            - overflow: hidden
                    pics: ""
                  grid_options:
                    columns: full
        column_span: 10
      - type: grid
      - type: grid
      - type: grid
      - type: grid
      - type: grid
    max_columns: 10
    cards: []
    theme: liquid-glass
  - type: sections
    max_columns: 10
    path: plan
    title: Plan
    sections:
      - type: grid
        cards:
          - type: custom:mushroom-select-card
            entity: input_select.column_ab1
            grid_options:
              columns: 10
              rows: 4
          - type: custom:mushroom-select-card
            entity: input_select.column_c1
            grid_options:
              columns: 5
              rows: 4
          - type: custom:mushroom-select-card
            entity: input_select.column_d1
            grid_options:
              columns: 5
              rows: 4
          - type: custom:mushroom-select-card
            entity: input_select.column_ef1
            grid_options:
              columns: 10
              rows: 4
          - type: custom:mushroom-select-card
            entity: input_select.column_g1
            grid_options:
              columns: 5
              rows: 4
            name: Column G1
          - type: custom:mushroom-select-card
            entity: input_select.column_h1
            grid_options:
              columns: 5
              rows: 4
            name: Column H1
        column_span: 4
      - type: grid
        cards:
          - type: custom:mushroom-select-card
            entity: input_select.column_a2
            grid_options:
              columns: 5
              rows: 4
          - type: custom:mushroom-select-card
            entity: input_select.column_b2
            grid_options:
              columns: 5
              rows: 4
          - type: custom:mushroom-select-card
            entity: input_select.column_cd2
            grid_options:
              columns: 10
              rows: 4
          - type: custom:mushroom-select-card
            entity: input_select.column_e2
            grid_options:
              columns: 5
              rows: 4
          - type: custom:mushroom-select-card
            entity: input_select.column_f2
            grid_options:
              columns: 5
              rows: 4
          - type: custom:mushroom-select-card
            entity: input_select.column_g2
            grid_options:
              columns: 5
              rows: 4
          - type: custom:mushroom-select-card
            entity: input_select.column_h2
            grid_options:
              columns: 5
              rows: 4
        column_span: 4
      - type: grid
        cards: []
        column_span: 4
