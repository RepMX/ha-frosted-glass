            styles:
              name:
                - font-family: "'Dongle', sans-serif"
                - font-weight: 300
                - font-size: 28px
                - color: rgba(255,255,255,0.8)
                - letter-spacing: 0.5px
                - text-align: left
                - justify-self: start
                - align-self: center
