              icon:
                - width: 40px
                - margin: 0px 0px 20px 0px
                - justify-self: center
                - align-self: center
                - color: rgba(255,255,255,0.8)
                - pointer-events: auto
              grid:
                - grid-template-areas: |
                    "i"
                    "todo"
                - grid-template-rows: auto 1fr
                - grid-template-columns: 1fr
                - align-content: start
                - align-self: start
                - justify-content: center
                - justify-self: center
                - padding: 0px
              card:
                - display: flex
                - align-content: start
                - align-self: start
                - justify-items: center
                - justify-content: center
                - justify-self: center
                - background-color: transparent
                - padding: 0px
                - margin: 0px 0px 80px 0px
                - overflow-y: auto
                - overflow-x: hidden
                - border: none
                - pointer-events: none
            custom_fields:
              i:
                card:
                  type: custom:button-card
                  icon: mdi:clock-digital
                  show_name: false
                  show_state: false
                  tap_action:
                    action: navigate
                    navigation_path: ./alarm-clock
                  styles:
                    card:
                      - background-color: transparent
                      - border: none
                      - box-shadow: none
                      - width: 70px
                      - height: 56px
                      - padding: 10px
                      - margin: 0px 0px 10px 0px
                      - justify-self: center
                      - align-self: center
                      - pointer-events: none
                      - transition: transform 0.2s ease, filter 0.2s ease
                    icon:
                      - width: 40px
                      - color: rgba(255,255,255,0.8)
                  card_mod:
                    style: |
                      ha-card:hover {
                        filter: brightness(1.3) drop-shadow(0px 0px 8px rgba(255, 255, 255, 0.4)) !important;
                      }
              todo:
                card:
                  type: custom:auto-entities
                  card:
                    type: vertical-stack
                  card_param: cards
                  filter:
                    template: >
                      {% set alarms = state_attr('sensor.alarm_clock_items',
                      'alarms') %}

                      {% if alarms %}
                        {# Step 1: Map the alarms with their original index tracking #}
                        {% set ns = namespace(items=[]) %}
                        {% for i in range(alarms | length) %}
                          {% set ns.items = ns.items + [{'orig_index': i, 'time': alarms[i].summary}] %}
                        {% endfor %}
                        
                        {# Step 2: Sort by newest created first (highest original array index first) #}
                        {% set sorted_by_creation = ns.items | sort(attribute='orig_index', reverse=true) %}
                        
                        {# Step 3: Sort by alarm time chronologically #}
                        {% set final_sorted = sorted_by_creation | sort(attribute='time') %}
                        
                        [
                        {% for item in final_sorted %}
                          {
                            "type": "custom:button-card",
                            "template": "alarm_list_slot",
                            "entity": "sensor.alarm_clock_items",
                            "variables": {
                              "slot_index": {{ item.orig_index }}
                            },
                            "styles": {
                              "card": [
                                {"margin-bottom": "6px"}
                              ]
                            }
                          }{% if not loop.last %},{% endif %}
                        {% endfor %}
                        ]
                      {% else %}
                        []
                      {% endif %}
          - type: custom:button-card
            show_state: false
            show_name: false
            show_icon: false
            styles:
              card:
                - visibility: hidden
            card_mod:
              style: |
                :host::after {
                  content: "" !important;
                  position: fixed !important;
                  top: 0 !important;
                  left: 0 !important;
                  width: 100vw !important;
                  height: 100vh !important;
                  z-index: 9999 !important; 
                  pointer-events: none !important;
                  {% set hour = now().hour %}
                  {% if 5 <= hour < 12 %}
                    backdrop-filter: brightness(100%) contrast(100%) !important;
                    -webkit-backdrop-filter: brightness(100%) contrast(100%) !important;
                  {% elif 12 <= hour < 18 %}
                    background: linear-gradient(rgba(255, 215, 110, 0.07), rgba(240, 130, 10, 0.42)) !important;
                    backdrop-filter: brightness(98%) contrast(102%) !important;
                    -webkit-backdrop-filter: brightness(98%) contrast(102%) !important !important;
                  {% elif 18 <= hour < 20 %}
                    background: linear-gradient(rgba(255, 240, 0, 0.11), rgba(30, 4, 70, 0.65)) !important;
                    backdrop-filter: brightness(80%) contrast(104%) !important;
                    -webkit-backdrop-filter: brightness(80%) contrast(104%) !important;
                  {% else %}
                    background: linear-gradient(rgba(90, 0, 80, 0.18), rgba(2, 0, 9, 1)) !important;
                    backdrop-filter: brightness(70%) contrast(108%) !important;
                    -webkit-backdrop-filter: brightness(70%) contrast(108%) !important;
                  {% endif %}
                }
        column_span: 2
    max_columns: 2
    cards: []
