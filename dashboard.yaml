kiosk_mode:
  non_admin_settings:
    kiosk: true
  hide_header: "{{ is_state('input_boolean.standby_kiosk_mode', 'on') }}"
  hide_sidebar: "{{ is_state('input_boolean.standby_kiosk_mode', 'on') }}"
button_card_templates:
  day_selector_button:
    show_name: true
    show_icon: false
    show_state: false
    tap_action:
      action: toggle
    extra_styles: |
      :host, #aspect-ratio {
        max-width: none !important;
        justify-self: center !important;
        width: 100% !important;
      }
    styles:
      grid:
        - grid-template-areas: "\"n\""
        - grid-template-columns: 1fr
        - grid-template-rows: 1fr
      card:
        - background-color: transparent
        - height: 36px
        - width: 100%
        - box-sizing: border-box
        - padding: 0px
        - align-content: center
        - justify-content: center
        - align-self: center
      name:
        - font-family: "'Dongle', sans-serif"
        - box-sizing: border-box
        - width: 100%
        - text-align: center
        - justify-self: center
        - align-self: center
        - padding: 5px
        - margin: 0px
        - font-size: 26px
        - font-weight: 300
        - text-box: trim-both cap alphabetic
        - color: |
            [[[ 
              return entity.state === 'on' ? 'rgba(255, 255, 255, 0.9)' : 'rgba(255, 255, 255, 0.7)'; 
            ]]]
    card_mod:
      style:
        .: |
          ha-card {
            font-family: "Dongle", sans-serif;
            font-weight: 300;
            background: {% if is_state(config.entity, 'on') %} linear-gradient(135deg, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0.22) 100%) {% else %} linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.02) 100%) {% endif %} !important;
            backdrop-filter: blur(20px) saturate(120%) brightness(95%) !important;
            -webkit-backdrop-filter: blur(20px) saturate(120%) brightness(95%) !important;
            -webkit-tap-highlight-color: transparent !important;
            box-shadow: inset -2px 2px 6px rgba(0, 0, 0, 0.05), inset 1px -1px 6px rgba(255, 255, 255, 0.02), 1px 4px 10px rgba(0, 0, 0, 0.15) !important;
            border: none !important;
            border-radius: 30px !important;
            position: relative;
            z-index: 1;
            transition: transform 0.2s ease, filter 0.2s ease;
          }

          ha-card:hover {
            filter: brightness(1.1);
          }

          :host {
            width: 100% !important;
            box-sizing: border-box !important;
            display: block;
            position: relative; 
            margin: 0px !important;
            cursor: pointer;
            overflow: visible !important;
            transition: transform 0.2s ease, filter 0.2s ease;
          }
          :host(:active) {
            transform: scale(0.95);
          }

          ha-card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 30px;
            -webkit-backdrop-filter: blur(50px);
            padding: 1px;
            background: linear-gradient(60deg, 
                rgba(255,255,255,0.0) 0%,
                rgba(255,255,255,0.25) 49%,
                rgba(255,255,255,0.25) 51%,
                rgba(255,255,255,0.0) 100%);
            -webkit-mask:
              linear-gradient(#fff 0 0) content-box,
              linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            z-index: 2; 
            filter: saturate(140%);
            pointer-events: none;
          }

          :host::after {
            content: "";
            background: linear-gradient(180deg, rgba(255,255,255, 0.05) 20%, rgba(255,255,255, 0.0) 100%); 
            position: absolute;
            inset: 0;
            border-radius: 30px;
            box-shadow: inset -4px 5px 8px rgba(0, 0, 0, 0.05);
            z-index: -1;
            -webkit-backdrop-filter: blur(20px) saturate(110%) brightness(90%);
            filter: drop-shadow(1px 2px 5px rgba(0, 0, 0, 0.1)); 
            pointer-events: none;
          }
  target_selector_button:
    show_name: true
    show_icon: true
    show_state: false
    max_columns: 4
    tap_action:
      action: toggle
    extra_styles: |
      :host, #aspect-ratio {
        max-width: none !important;
        justify-self: center !important;
        width: 100% !important;
      }
